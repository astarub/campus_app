# Local Keycloak server for development without RUB SSO
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    # Import the realm on first startup
    command: start-dev --import-realm
    environment:
      # Local development credentials
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports:
      # KEYCLOAK_ISSUER must use the same host port
      - "${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      # Keep local data and mount the realm configuration
      - keycloak_data:/opt/keycloak/data
      - ./docker/keycloak/campus-app-realm.json:/opt/keycloak/data/import/campus-app-realm.json:ro

volumes:
  keycloak_data:
